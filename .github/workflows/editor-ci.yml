name: Editor CI

on:
  pull_request:
    paths:
      - "editor/**"
      - ".github/workflows/editor-ci.yml"
  push:
    branches: [main]
    paths:
      - "editor/**"
      - ".github/workflows/editor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install editor dependencies
        run: npm ci
      - name: Test editor
        run: npm test
      - name: Build editor renderer
        run: npm run build
