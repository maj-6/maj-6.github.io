name: Deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install pipeline test dependencies
        run: python -m pip install --requirement pipeline/requirements.txt
      - name: Test pipeline and release gates
        run: |
          python -m compileall -q pipeline scripts tests
          python -m unittest discover -s tests/pipeline -p "test_*.py"
          python -m unittest discover -s tests/release -p "test_*.py"
      - name: Test static reader
        run: node --test tests/web/*.test.mjs
      - name: Verify committed catalog and CDN release
        run: python scripts/release_smoke.py --root . predeploy
      - name: Stage reader-only Pages artifact
        run: python scripts/stage_pages.py --root . --output .pages-artifact
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-artifact
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages release
        run: >-
          python scripts/release_smoke.py --root . postdeploy
          --site-url "${{ steps.deployment.outputs.page_url }}"
          --cache-bust "${{ github.sha }}"
